<!DOCTYPE html>
<html lang="zh-Hant" data-th="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6F2">

<meta name="mobile-web-app-capable" content="yes">

<title>321婚姻生活</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>:root{--bg:#FBF7EE;--card:#FFFDF8;--ink:#2B2A26;--mute:#7A7365;--line:#E8DFCB;--acc:#A9792A;--accS:#F3E6C8;--good:#5E7A3A;--sh:0 1px 2px rgba(60,45,20,.06),0 4px 16px rgba(60,45,20,.06);--fs:1}
html[data-th=noon]{--bg:#F4F6EF;--card:#FCFDF9;--ink:#26291F;--mute:#6D7362;--line:#DDE3D0;--acc:#5F7432;--accS:#E3EACF;--good:#5F7432}
html[data-th=night]{--bg:#121828;--card:#1B2337;--ink:#ECE8DE;--mute:#9AA0B2;--line:#2C3650;--acc:#D8B36A;--accS:#2E3448;--good:#9CBF6E;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:calc(16px*var(--fs));line-height:1.7;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.serif,.vs{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 18px 8px}
.brand{font-weight:700;letter-spacing:.06em;font-size:1.05em}
.brand small{display:block;font-weight:400;color:var(--mute);font-size:.7em;letter-spacing:.1em}
.icb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icb svg{width:22px;height:22px;stroke:var(--ink)}
main{max-width:640px;margin:0 auto;padding:4px 16px 24px}
h1{font-size:1.5em;margin:6px 0 2px;line-height:1.35}
h2{font-size:1.15em;margin:22px 0 10px}
.sub{color:var(--mute);font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card.hero{background:linear-gradient(160deg,var(--accS),var(--card) 70%);border-color:transparent}
.kick{font-size:.78em;letter-spacing:.12em;color:var(--acc);font-weight:600}
.ttl{font-size:1.25em;font-weight:700;margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:24px;background:var(--acc);color:#fff;font-weight:600}
html[data-th=night] .btn{color:#1B2337}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9em}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.vs{font-size:1.12em;line-height:1.95}
.vs sup{color:var(--acc);font-size:.62em;margin-right:3px;font-family:sans-serif}
.ref{color:var(--mute);font-size:.88em;margin-top:6px}
.chip{display:inline-block;padding:6px 14px;border-radius:18px;border:1px solid var(--line);margin:4px 6px 4px 0;font-size:.9em}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
html[data-th=night] .chip.on{color:#1B2337}
.banner{background:var(--accS);border-radius:16px;padding:14px 16px;margin:10px 0}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .n{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85em;color:var(--mute)}
.li .n.ok{background:var(--good);border-color:var(--good);color:#fff}
.li .b{flex:1;min-width:0}
.li .b b{display:block;font-weight:600}
.li .b span{color:var(--mute);font-size:.85em}
.lock{opacity:.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.72em;color:var(--mute);min-height:52px;justify-content:center;gap:2px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor}
nav.tabs button.on{color:var(--acc);font-weight:600}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.ov.show{display:block}
.ovh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 6px;z-index:2}
.dots{display:flex;gap:6px}
.dots i{width:30px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--acc)}
.stepbody{max-width:620px;margin:0 auto;padding:10px 20px 120px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.big{font-size:4.2em;font-weight:700;color:var(--acc);line-height:1;font-family:"Noto Serif TC",serif}
.stepfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:12px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:660px;margin:0 auto;z-index:3}
.stepfoot .btn{flex:1}
.light{border-left:3px solid var(--acc);padding:6px 0 6px 14px;margin:16px 0;color:var(--ink)}
.q{margin:18px 0 6px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;margin:8px 0;background:var(--card)}
.opt.on{border-color:var(--acc);background:var(--accS)}
.breath{width:150px;height:150px;border-radius:50%;margin:26px auto;background:radial-gradient(circle,var(--accS),transparent 70%);border:2px solid var(--acc);animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.72);opacity:.6}50%{transform:scale(1);opacity:1}}
.flip{min-height:190px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.stat{font-size:2.2em;font-weight:700;color:var(--acc);line-height:1.1}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;padding:4px 0 14px}
.tl .it:before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl .it .d{font-size:.78em;color:var(--mute)}
.tag{font-size:.72em;padding:1px 8px;border-radius:8px;background:var(--accS);color:var(--acc);margin-left:6px}
.grid7{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.mod b{display:block}
.mod span{font-size:.8em;color:var(--mute)}
.seg{display:flex;background:var(--accS);border-radius:14px;padding:4px;margin:8px 0}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:.9em}
.seg button.on{background:var(--card);font-weight:600;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:.9em;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.foot{text-align:center;color:var(--mute);font-size:.82em;margin:28px 0 8px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:.92em}
.done-mark{width:84px;height:84px;margin:30px auto 10px;border-radius:50%;background:var(--accS);display:flex;align-items:center;justify-content:center}
.done-mark svg{width:42px;height:42px;stroke:var(--acc)}
.li .n svg{width:18px;height:18px;stroke:#fff}
.btn{white-space:nowrap;flex:none}
.btn svg{width:18px;height:18px;stroke:currentColor}
.heroimg{display:block;width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:22px;margin:18px auto 0;box-shadow:0 8px 28px rgba(60,45,20,.18)}
html[data-th=night] .btn.ghost{color:var(--acc)}
.prog{height:6px;border-radius:3px;background:var(--line);margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
.card.wk{padding:4px 14px}
.card.wk.cur{border-color:var(--acc)}
.chev svg{width:20px;height:20px;stroke:var(--mute);transition:transform .2s}
.chev.up svg{transform:rotate(180deg)}
.li.sm{padding:9px 2px}
.li.sm .n{width:30px;height:30px}
.scale{display:flex;gap:8px;margin:6px 0 4px}
.scale button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
html[data-th=night] .scale button.on{color:#1B2337}
.radar{display:block;width:100%;max-width:400px;margin:8px auto}
.radar .rn{fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:2}
.radar .rp{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 4}
.lg{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:4px;border-radius:2px}
.lg.rn{background:var(--acc)}.lg.rp{background:var(--mute)}
/* ===== v2 additions ===== */
html[lang="zh-Hans"] body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
html[lang="zh-Hans"] .serif,html[lang="zh-Hans"] .vs,html[lang="zh-Hans"] .vsp{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
html[lang="en"] body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6}
html[lang="en"] .serif,html[lang="en"] .vs,html[lang="en"] .vsp{font-family:Georgia,"Times New Roman",serif}
.big.en{font-size:2.6em;letter-spacing:-.01em}
header.top{gap:8px}
.brand{flex:1;min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.74em;flex:none}
.langsw button{padding:6px 9px;font-weight:600;color:var(--mute);background:var(--card)}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button.on{background:var(--acc);color:#fff}
html[data-th=night] .langsw button.on{color:#1B2337}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
html[lang="en"] nav.tabs button{font-size:.62em}
.vsp{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:1.05em;line-height:1.95}
.vn{font-family:sans-serif;font-size:.6em;font-weight:700;color:var(--acc);vertical-align:.5em;margin:0 .18em 0 .1em}
.stepbody p.blk{margin:0 0 14px}
.light.blk{border-left:3px solid var(--acc);padding:6px 0 6px 14px;margin:16px 0}
.sent{cursor:pointer;border-radius:3px;transition:box-shadow .2s}
.sent[data-hl]{background:linear-gradient(transparent 56%,var(--hlg) 56%)}
.sent[data-color=gold]{--hlg:#F3DFA8}.sent[data-color=green]{--hlg:#CFE7CB}.sent[data-color=blue]{--hlg:#CCDDF3}.sent[data-color=pink]{--hlg:#F7D2DA}
.sent[data-color=purple]{--hlg:#DDD0EE}.sent[data-color=maroon]{--hlg:#EBCBCB}.sent[data-color=brown]{--hlg:#E6D6BE}.sent[data-color=charcoal]{--hlg:#D8D6D0}
html[data-th=night] .sent[data-color=gold]{--hlg:#5A4A22}html[data-th=night] .sent[data-color=green]{--hlg:#2A4128}html[data-th=night] .sent[data-color=blue]{--hlg:#24385A}html[data-th=night] .sent[data-color=pink]{--hlg:#57303A}
html[data-th=night] .sent[data-color=purple]{--hlg:#3E3254}html[data-th=night] .sent[data-color=maroon]{--hlg:#4A2A2A}html[data-th=night] .sent[data-color=brown]{--hlg:#4A3B26}html[data-th=night] .sent[data-color=charcoal]{--hlg:#3A3A36}
.sent.tts-reading{box-shadow:inset 0 0 0 999px rgba(108,147,209,.22);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-note{margin:-6px 0 14px;padding:8px 12px;background:var(--accS);border-left:3px solid #D9B168;border-radius:6px;font-size:.88em;white-space:pre-wrap;cursor:pointer;line-height:1.6}
.hl-note[data-color=green]{border-left-color:#6FAE71}.hl-note[data-color=blue]{border-left-color:#6C93D1}.hl-note[data-color=pink]{border-left-color:#E58FA0}.hl-note[data-color=purple]{border-left-color:#A48AC9}.hl-note[data-color=maroon]{border-left-color:#8C4A4E}.hl-note[data-color=brown]{border-left-color:#8A6740}.hl-note[data-color=charcoal]{border-left-color:#54534E}
.hl-tip{background:var(--accS);color:var(--acc);border-radius:10px;padding:9px 12px;font-size:.82em;line-height:1.6;margin:8px 0 12px}
.ovmid{flex:1;display:flex;justify-content:center;min-width:0;font-weight:600}
.ovr{display:flex;align-items:center}
.ttsb[data-state=playing],.ttsb[data-state=loading]{background:var(--acc)}
.ttsb[data-state=playing] svg,.ttsb[data-state=loading] svg{stroke:#fff}
.ttsb[data-state=loading]{opacity:.7}
.askrow{margin:18px 0 4px;text-align:center}
.btn svg{margin-right:2px}
.btn.gold{background:#B8862F;color:#fff;border:0}
.danger{color:#B4503C!important;border-color:#B4503C!important}
.chips{display:flex;flex-wrap:wrap}
/* bottom sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;display:flex;align-items:flex-end;animation:fade .2s}
.sheet-card{background:var(--card);width:100%;max-width:640px;margin:0 auto;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-title{font-weight:700;font-size:1.05em;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sheet-ref{font-size:.8em;color:var(--acc);font-weight:600}
.sheet-quote{display:block;background:var(--accS);border-radius:10px;padding:10px 12px;line-height:1.8;margin-bottom:12px;font-family:"Noto Serif TC",serif}
.sheet-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-lab{font-size:.82em;color:var(--mute);white-space:nowrap;min-width:3em}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.hlswatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.hlswatch.on{border-color:var(--ink)}
.spanrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spanbtn{min-width:36px;height:32px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
.spanbtn.wide{font-size:.85em;padding:0 12px}
.spannum{font-size:.85em;color:var(--mute);min-width:44px;text-align:center}
.sheet-ta{min-height:76px;margin-bottom:12px}
.sheet-acts{display:flex;gap:10px;margin-bottom:10px}.sheet-acts .btn{flex:1}
.sheet-acts2{display:flex;gap:8px;flex-wrap:wrap}.sheet-acts2 .btn{flex:1 1 auto}
.holdpv img{width:100%;border-radius:10px}
/* my highlights */
.hitem{border-bottom:1px solid var(--line);padding:12px 0}.hitem:last-child{border-bottom:0}
.hitem .q{font-size:.98em;line-height:1.85;margin-bottom:6px;padding-left:10px;border-left:3px solid #D9B168}
.hitem .q[data-c=green]{border-left-color:#6FAE71}.hitem .q[data-c=blue]{border-left-color:#6C93D1}.hitem .q[data-c=pink]{border-left-color:#E58FA0}.hitem .q[data-c=purple]{border-left-color:#A48AC9}.hitem .q[data-c=maroon]{border-left-color:#8C4A4E}.hitem .q[data-c=brown]{border-left-color:#8A6740}.hitem .q[data-c=charcoal]{border-left-color:#54534E}
.hitem .n{font-size:.88em;background:var(--accS);border-radius:6px;padding:7px 10px;margin-bottom:6px;white-space:pre-wrap}
.hitem .m{font-size:.78em;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hitem .m button{padding:4px 8px;color:var(--mute)}.hitem .m button svg{width:16px;height:16px;stroke:var(--mute);vertical-align:-3px}
.hitem .md{font-size:.92em}
/* xiaozhi */
.xzcard{cursor:pointer}.xzimg{width:46px;height:46px;border-radius:12px;flex:none}
.xz-head{display:flex;gap:12px;align-items:center;margin:6px 0 10px}.xz-head img{width:44px;height:44px;border-radius:12px}.xz-head b{font-size:1.15em;font-family:"Noto Serif TC",serif}
.chatctx{font-size:.78em;color:var(--mute);background:var(--accS);border-radius:999px;padding:5px 12px;display:inline-block;margin-bottom:8px}
.qs-toggle{display:block;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:6px 14px;font-size:.82em;font-weight:600;margin:4px 0 8px}
.qs-panel{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.qs-chip{text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88em;background:var(--bg)}
.chatlog{padding:4px 0 90px}
.msg{max-width:88%;padding:11px 15px;border-radius:16px;margin-bottom:12px;line-height:1.75;font-size:.95em}
.msg.user{background:var(--acc);color:#fff;margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}
html[data-th=night] .msg.user{color:#1B2337}
.msg.ai{background:var(--card);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px;max-width:96%;box-shadow:var(--sh)}
.msg-body p,.md p{margin:0 0 9px}.msg-body p:last-child{margin-bottom:0}
.msg-body h4,.msg-body h5,.md h4{margin:14px 0 6px;font-size:1.02em;color:var(--acc);font-family:"Noto Serif TC",serif;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.msg-body h4:first-child{margin-top:2px}
.msg-body b{color:var(--ink)}
.msg-body blockquote,.md blockquote{margin:10px 0;padding:10px 14px;border-left:4px solid var(--acc);background:var(--accS);border-radius:0 10px 10px 0;font-family:"Noto Serif TC",serif;font-size:1.02em}
.msg-body ul,.msg-body ol,.md ul{margin:4px 0 10px;padding-left:22px}.msg-body li{margin-bottom:5px}
.msg-body ol{list-style:decimal}
.msg-body hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.vref{color:var(--acc);font-weight:600;white-space:nowrap}
.mdtb{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:10px 0;font-size:.88em;line-height:1.6}
.mdtb th,.mdtb td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.mdtb th{background:var(--accS);color:var(--acc);white-space:nowrap}
.mdtb tr:nth-child(even) td{background:var(--bg)}
.msg-actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.msg-act{font-size:.78em;color:var(--mute);padding:4px 8px;border-radius:999px}.msg-act.on{color:var(--acc);font-weight:700}
.typing{display:inline-flex;gap:3px;vertical-align:middle}.typing i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chatinput{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);max-width:640px;margin:0 auto;z-index:5}

,"家庭祭壇與傳承"],"facetsShort":["信仰","無己","愛","溝通","和好","饒恕","順服","時間","金錢","親密","界線","祭壇"],"assess":[["我們會一起禱告或讀經。","在重要的決定上，我們會一起尋求神的心意。"],["我能為自己的錯先認錯，不急着辯解。","我願意放下自己的偏好，成全配偶。"],["我常用配偶能感受到的方式表達愛。","配偶知道我欣賞、感謝他。"],["我能專心聽完配偶說話，不急着打斷或給答案。","我能說出自己真正的需要，而不是指責。"],["我們吵架後，能在一兩天內和好。","在衝突中，我能先看見自己的部分。"],["我不翻舊帳。","我已把過去的傷害交給神，選擇饒恕。"],["我們能彼此尊重，沒有一方控制另一方。","我們做決定時，會考慮彼此的意見。"],["我們每週都有專屬於兩人的時間。","我們能放下手機，專心陪伴彼此。"],["我們在金錢上彼此透明、沒有隱瞞。","我們一起決定預算與奉獻。"],["我們的身體親密是彼此滿足、彼此尊重的。","我們能談心，在情感上感到親近。"],["在原生家庭與配偶之間，我知道以配偶為優先。","我們能一起尊敬雙方父母，也守住合宜的界線。"],["我們有固定的家庭敬拜或屬靈時光。","我們願意陪伴、祝福其他夫妻或家庭。"]],"mendSteps":[{"k":"stop","n":"停","d":"先停下來禱告","t":"衝突升高時，先停下來。對配偶說：「我想先停一下，等一下再好好談。」深呼吸，對主說：「主啊，此刻求你作王，不是我。」","q":"此刻我想對主說的話","ph":"主啊，我現在覺得……"},{"k":"see","n":"看","d":"看見自己的部分","t":"先拿掉自己眼中的樑木。不是問「他錯在哪裏」，而是問「我的『己』在哪裏」：是驕傲、急躁、冷漠、控制，還是想贏？","q":"在這次衝突裏，我的部分是……","ph":"我發現我……"},{"k":"own","n":"認","d":"先認自己的錯","t":"謙卑帶動謙卑。只認自己的部分，不加「可是」。具體、簡短、真誠。","q":"我要對配偶說：「對不起，我錯在……」","ph":"對不起，我錯在……"},{"k":"ask","n":"求","d":"求饒恕，也饒恕","t":"求對方饒恕；也把對方欠我的債交給神。饒恕不是假裝沒事，而是不再追討。（饒恕不等於留在危險中。）","q":"我想求你饒恕的是……／我願意饒恕的是……","ph":"你願意饒恕我嗎？我也願意……"},{"k":"act","n":"和","d":"一個和好的行動","t":"用一個具體的行動，把和好落實在生活裏。人比事重要，關係比東西重要。","q":"或寫下你自己的和好行動","ph":"我要……"}],"mendActs":["牽手一起禱告","一個擁抱","約好一個時間好好談","為對方做一件服事的小事","寫一張道歉或感謝的字條"],"prayConfess":"主啊，我承認在這件事上，是我自己想作王。我的驕傲、急躁與冷漠傷了我的配偶，也讓你憂傷。求你赦免我，洗淨我；給我謙卑的心，先去認錯，先去和好。奉主耶穌的名，阿們。","prayForgive":"主啊，你饒恕了我一切的債。我把配偶欠我的這筆債交在你手中，不再追討、不再翻舊帳。求你醫治我心中的傷，也賜我智慧與安全，讓我們在你裏面重新和好。奉主耶穌的名，阿們。","fightRules":["對事不對人：說「我感到……」，不說「你總是……」","不翻舊帳，一次只談一件事","不在孩子或外人面前爭吵","不說「離婚」、不威脅、不冷戰","不動手、不摔東西、不辱罵","情緒太高就暫停，並約好回來談的時間","不可含怒到日落：睡前至少說一句「我愛你，我們明天再談」"],"hotlines":[["台灣","113 保護專線・1925 安心專線・1995 生命線"],["其他地區","請撥打當地的緊急電話或家庭暴力求助專線"],["立即危險","請先離開到安全的地方，並報警"]],"chatQ":["今天這一課的重點是甚麼？請用一個比喻說明。","我們最近常為同一件事吵架，可以怎樣用和好五步驟處理？","怎樣把一句抱怨改成說出需要？請給我三個例句。","配偶還沒信主，我可以怎樣在家中活出基督？","「彼此順服」和「控制」有甚麼不同？","請幫我們用本週的經文寫一段夫妻禱告。","我們很忙，怎樣每週安排一次有品質的約會？","920 是甚麼？我該怎樣在配偶身上實踐？"]}};

function splitS(text){

if(last<text.length&&trim(text.slice(last)))out.push(text.slice(last));return out.length?out:[text];}

if(SENT_END_ZH.indexOf(text.charAt(i))>=0){while(i+1<text.length&&CLOSERS.indexOf(text.charAt(i+1))>=0){cur+=text.charAt(++i);}out.push(cur);cur='';}}

/* ---------- 自動更新 ----------
新版上傳後：瀏覽器在背景下載新的 sw.js → 裝好就接手 → 不在上課中就自動重新載入；
正在靈修／寫東西時只顯示提示條，按一下（或下次回到 App）才更新，不會打斷。 */
var swReg=null,updPending=false,reloading=false;
function busyNow(){return !!(flow&&!flow.done)||!!$('sheet')||(ovOpen()&&!!qa('textarea',$('ov')).length);}
function doReload(){if(reloading)return;reloading=true;grabInputs();save();location.reload();}
function updBar(){if($('updbar'))return;var d=document.createElement('div');d.id='updbar';d.className='updbar';d.textContent=T('updReady');d.onclick=doReload;document.body.appendChild(d);}
function onNewVersion(){updPending=true;if(!busyNow())doReload();else updBar();}
function checkUpdate(manual){if(swReg){try{swReg.update();}catch(e){}}
ajax('GET','version.json?t='+Date.now(),null,null,function(st,txt){var v=null;try{v=JSON.parse(txt).v;}catch(e){}
if(v&&v!==APPVER){if(swReg&&swReg.waiting){swReg.waiting.postMessage('skip');}else if(!swReg){onNewVersion();}if(manual)toast(T('updFound'));}
else if(manual)toast(st===200?T('updLatest',APPVER):T('updFail'));});}
function swInit(){
if(!('serviceWorker' in navigator)||location.protocol.indexOf('http')!==0){setTimeout(function(){checkUpdate(false);},4000);return;}
try{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){swReg=reg;
if(reg.waiting)reg.waiting.postMessage('skip');
reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)nw.postMessage('skip');});});
setTimeout(function(){checkUpdate(false);},3000);
})['catch'](function(){});
var had=!!navigator.serviceWorker.controller;
navigator.serviceWorker.addEventListener('controllerchange',function(){if(!had){had=true;return;}onNewVersion();});}catch(e){}
document.addEventListener('visibilitychange',function(){if(document.hidden){if(updPending)doReload();}else checkUpdate(false);});
setInterval(function(){checkUpdate(false);},30*60*1000);
}
})();</script>
